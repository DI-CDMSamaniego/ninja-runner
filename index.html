<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninja Runner</title>
<meta name="description" content="Ninja Runner - run, jump, double jump and slide past crates, spikes and bamboo logs. Free browser game.">
<meta property="og:title" content="Ninja Runner">

<style>
html,body{--adh:calc(50px + env(safe-area-inset-bottom,0px));margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{display:block;position:fixed;left:0;top:0;width:100vw;height:calc(100% - var(--adh))}
#ui{position:fixed;top:0;left:0;right:0;bottom:var(--adh);pointer-events:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.hidden{display:none!important}
.bar{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 12px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.btn{pointer-events:auto;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.9);background:rgba(22,22,30,.88);color:#fff;font:700 16px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn small{opacity:.75;font-weight:600}
.btn:focus-visible,.card:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.primary{background:#c8201a}
.gold{background:#9a6a00}
.fb{background:#1877f2}
.fb2{background:#0f5bc4}
.ghost{background:rgba(22,22,30,.75)}
.fbf{display:inline-block;width:20px;height:20px;border-radius:4px;background:#fff;color:#1877f2;font:900 17px/21px Arial,sans-serif;margin-right:8px;text-align:center;vertical-align:-3px}
.chip{background:rgba(0,0,0,.65);border:2px solid #ffc400;color:#ffd84a;border-radius:999px;padding:9px 14px;font-weight:800;font-size:15px;white-space:nowrap}
#shop{position:absolute;inset:0;pointer-events:auto;background:rgba(10,10,18,.9);touch-action:auto}
.shopIn{max-width:940px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.shopHead{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));flex:none}
.title{flex:1;text-align:center;font-weight:800;font-size:22px;letter-spacing:1px}
.bal{background:#24242e;border:2px solid #ffc400;border-radius:999px;padding:9px 14px;font-weight:800;color:#ffd84a;white-space:nowrap}
#pv{width:100%;height:110px;display:block;flex:none}
#shopList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 12px 28px}
.sec{font-weight:800;font-size:15px;margin:14px 2px 8px;color:#ffd23f;text-transform:uppercase;letter-spacing:1px}
.sec small{color:#bbb;text-transform:none;font-weight:600;letter-spacing:0;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{position:relative;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:14px;border:2px solid #3a3a48;background:#1d1d27;color:#fff;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;touch-action:manipulation;min-height:156px}
.card .ic{width:64px;height:64px}
.card .nm{font-weight:800}
.card .rar{font-size:12px;font-weight:700}
.card .ds{font-size:11px;color:#bbb;text-align:center;line-height:1.2}
.card .act{margin-top:auto;padding:7px 8px;border-radius:10px;background:#2f6f2f;font-weight:800;width:88%;box-sizing:border-box}
.card.buy .act{background:#a87400}
.card.poor .act{background:#44444f;color:#ff9b9b}
.card.eq{border-color:#ffd23f}
.card.eq .act{background:#ffd23f;color:#222}
.card .cnt{position:absolute;top:6px;right:6px;background:#2f6f2f;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (max-width:560px){.title{display:none}.btn small{display:none}.shopHead{justify-content:space-between}}
.btn{min-width:0}
.home{gap:12px}
.home .row{gap:10px}
.home .bigPlay{min-width:180px;font-size:18px;padding:12px 34px}
.home .sub{min-width:150px}
.chip.sm{padding:5px 11px;font-size:13px;border-width:1.5px;font-weight:700}
#overBar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.panel{background:rgba(12,12,20,.78);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px 26px 20px;width:min(320px,86vw);box-sizing:border-box;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel h2{margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:3px;color:#fff}
.stats{display:flex;justify-content:center;gap:28px;margin-bottom:6px}
.stat .lb{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#9a9aab}
.stat .vl{font-size:30px;font-weight:800;color:#fff;line-height:1.15;margin-top:2px}
.nb{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;background:rgba(255,196,0,.16);color:#ffd23f;font-size:12px;font-weight:800;letter-spacing:.5px}
.pbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.pbtns .btn{width:100%}
.pduo{display:flex;gap:10px}
.pduo .btn{width:auto;flex:1.6}
.pduo .home2{flex:1;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.55)}
#toast{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
#toast.on{opacity:1}
#toast.bad{background:#b3261e}
.reward{background:#6a2bd1;border-color:#e6d8ff}
/* attack button (touch devices, only while playing with a weapon equipped) */
#bAtk{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:18px;width:86px;height:86px;border-radius:50%;pointer-events:auto;touch-action:none;border:3px solid rgba(255,255,255,.92);background:rgba(200,32,26,.82);box-shadow:0 4px 0 rgba(0,0,0,.4);padding:0;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
#bAtk canvas{width:62px;height:62px;pointer-events:none}
#bAtk.cool{background:rgba(120,30,26,.75)}
#bAtk:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
/* ===== AD PLACEHOLDER STYLES (see AdService) ===== */
#adBanner{position:fixed;left:0;right:0;bottom:0;height:var(--adh);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);background:#1c1c22;border-top:1px solid #3a3a46;display:flex;align-items:center;justify-content:center;gap:10px;font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#9a9aab;z-index:20;overflow:hidden}
.adTag{display:inline-block;background:#ffd23f;color:#222;font:800 11px/1 system-ui,sans-serif;padding:3px 6px;border-radius:4px;letter-spacing:.5px}
.adScreen{position:fixed;inset:0;z-index:50;background:#0d0d14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
.adScreen .adTag{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;font-size:13px;padding:4px 8px}
.adScreen .adBox{width:min(520px,88vw);height:min(260px,40vh);border:2px dashed #4a4a5a;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9a9aab;font-weight:700;font-size:18px}
.adScreen .adBox b{font-size:26px;color:#fff}
.adScreen .adNote{font-size:14px;color:#9a9aab;min-height:20px}
.adScreen .btn{min-width:140px}
.adScreen .adX{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;min-height:40px;padding:6px 14px;font-size:14px}
.adProg{width:min(520px,88vw);height:10px;border-radius:99px;background:#2a2a36;overflow:hidden}
.adProg i{display:block;height:100%;width:0;background:#ffd23f}

</style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="startBar" class="bar home hidden">
    <div class="row"><button id="bPlay" class="btn primary bigPlay">Play</button></div>
    <div class="row"><button id="bShop1" class="btn gold sub">Shop <small>(S)</small></button><button id="bInvite" class="btn fb2 sub">Invite friends</button></div>

      <div class="stats"><div class="stat"><div class="lb">Score</div><div id="oScore" class="vl">0</div></div><div class="stat"><div class="lb">Best</div><div id="oBest" class="vl">0</div></div></div>

      <div class="pbtns"><div class="pduo"><button id="bAgain" class="btn primary">Play again</button><button id="bHome" class="btn home2" title="Home (Esc)">Home</button></div><button id="bReward" class="btn reward hidden">Watch ad: double points</button><button id="bFb" class="btn fb"><span class="fbf">f</span>Share</button></div>
    </div>
  </div>

    <div class="shopIn">
      <div class="shopHead"><button id="bBack" class="btn ghost">&lsaquo; Back <small>(Esc)</small></button><div class="title">NINJA SHOP</div><div id="bal" class="bal">0 pts</div></div>

      <div id="shopList"></div>

</div>
<div id="adBanner" role="complementary" aria-label="Advertisement"><span class="adTag">Ad</span><span>Ad placeholder &middot; banner 320&times;50</span></div>
<script>
/* =====================================================================
   GAME_URL  -  PUBLIC LINK USED FOR FACEBOOK SHARING / INVITES
   Put the game's public address here once it is online, e.g.
     var GAME_URL = 'https://your-site.com/ninja-runner/';
   While empty: the page's own address is used when served over http(s).
   Opened from file:// there is no shareable link, so sharing falls back
   to copying the message (Copy link button).
   ===================================================================== */
var GAME_URL = '';

/* =====================================================================
   AdService  -  ALL ADS GO THROUGH HERE (currently PLACEHOLDERS ONLY)
   No network calls, no real ads. To go live, replace the body of each
   function with the real SDK call (AdMob for an app wrapper, AdSense /
   Google H5 Games Ads adBreak() for web) and keep the same callbacks:
     showBanner()                    - bottom strip (#adBanner, 50px space is
                                       reserved via the CSS var --adh)
     showInterstitial(onClose)       - full-screen ad; call onClose() when gone
     showRewarded(onReward, onClose) - video ad; call onReward() ONLY when fully
                                       watched, then onClose() in every case
   onGameOver() counts game overs (localStorage) and shows an interstitial
   on every INTERSTITIAL_EVERY-th one.
   ===================================================================== */
var AdService=(function(){
  'use strict';
  var INTERSTITIAL_EVERY=8, INTERSTITIAL_CLOSE_SEC=3, REWARDED_SEC=5;
  var COUNT_KEY='ninjaRunnerGameOverCount';
  var open=null; // currently shown full-screen ad element
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function screen(){
    var s=el('div','adScreen');s.setAttribute('role','dialog');s.setAttribute('aria-label','Advertisement');
    s.appendChild(el('span','adTag','Ad'));
    ['touchstart','touchmove','touchend','mousedown','click'].forEach(function(t){s.addEventListener(t,function(e){e.stopPropagation()})});
    document.body.appendChild(s);open=s;return s;
  }
  function closeScreen(s){if(s&&s.parentNode)s.parentNode.removeChild(s);if(open===s)open=null}
  var memCount=0; // fallback when localStorage is blocked
  function getCount(){try{var v=parseInt(localStorage.getItem(COUNT_KEY)||'0',10)||0;return Math.max(v,memCount)}catch(e){return memCount}}
  function setCount(n){memCount=n;try{localStorage.setItem(COUNT_KEY,String(n))}catch(e){}}

  // --- BANNER (placeholder) --- real: AdMob BannerAd / AdSense <ins> slot inside #adBanner
  function showBanner(){var b=document.getElementById('adBanner');if(b)b.style.display=''}

  // --- INTERSTITIAL (placeholder) --- real: AdMob InterstitialAd.show() / adBreak({type:'next'})
  function showInterstitial(onClose){
    if(open){onClose&&onClose();return}
    var s=screen(),left=INTERSTITIAL_CLOSE_SEC;
    s.appendChild(el('div','adBox','<b>Ad</b>Ad placeholder &middot; interstitial'));
    // Close button is shown disabled with a countdown, enabled after INTERSTITIAL_CLOSE_SEC
    var b=el('button','btn ghost','Close in '+left+'s');b.id='adClose';b.disabled=true;b.style.opacity='.6';s.appendChild(b);
    var iv=setInterval(function(){left--;if(left>0){b.textContent='Close in '+left+'s'}else{clearInterval(iv);b.textContent='Close';b.disabled=false;b.style.opacity='';b.className='btn primary';b.focus()}},1000);
    b.addEventListener('click',function(){if(b.disabled)return;clearInterval(iv);closeScreen(s);onClose&&onClose()});
  }

  // --- REWARDED (placeholder) --- real: AdMob RewardedAd (onUserEarnedReward) / adBreak({type:'reward'})
  function showRewarded(onReward,onClose){
    if(open){onClose&&onClose();return}
    var s=screen(),t0=Date.now(),done=false,dur=REWARDED_SEC*1000;
    s.appendChild(el('div','adBox','<b>Ad</b>Ad placeholder &middot; rewarded video'));
    var bar=el('div','adProg','<i></i>');s.appendChild(bar);
    var note=el('div','adNote','Reward in '+REWARDED_SEC+'s');s.appendChild(note);
    var x=el('button','btn ghost adX','&#10005; Close (no reward)');x.id='adCloseEarly';s.appendChild(x);
    var iv=setInterval(function(){
      var f=Math.min(1,(Date.now()-t0)/dur);bar.firstChild.style.width=(f*100).toFixed(1)+'%';
      if(f<1){note.textContent='Reward in '+Math.ceil((dur-(Date.now()-t0))/1000)+'s';return}
      clearInterval(iv);done=true;note.textContent='Reward earned!';
      setTimeout(function(){closeScreen(s);onReward&&onReward();onClose&&onClose()},500);
    },100);
    x.addEventListener('click',function(){if(done)return;clearInterval(iv);closeScreen(s);onClose&&onClose()});
  }

  // called once per game over (from the game's showAd hook)
  function onGameOver(onClose){
    var n=getCount()+1;setCount(n);
    if(n%INTERSTITIAL_EVERY===0)showInterstitial(onClose);else if(onClose)onClose();
    return n;
  }
  return {showBanner:showBanner,showInterstitial:showInterstitial,showRewarded:showRewarded,
    onGameOver:onGameOver,isOpen:function(){return !!open},gameOverCount:getCount,COUNT_KEY:COUNT_KEY,INTERSTITIAL_EVERY:INTERSTITIAL_EVERY};
})();
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,U=1,GROUND=0,MOBILE=false,TOUCH=false,MIN_VIEW=12.5,PX=2.5,REACT_SEC=2.42,START_SPD=6; // START_SPD must equal BASE_SPEED
var HS_KEY='ninjaRunnerHighScore',OLD_HS_KEY='stickRunnerHighScore';
function loadHS(){try{return parseInt(localStorage.getItem(HS_KEY)||localStorage.getItem(OLD_HS_KEY)||'0',10)||0}catch(e){return 0}}
function saveHS(v){try{localStorage.setItem(HS_KEY,String(v))}catch(e){}}

/* ===== AD HOOK =====
   showAd(): called on game over. Routes to AdService (counts game overs,
   interstitial every 8th). All ad code lives in AdService at the top. */
function showAd(){ AdService.onGameOver(); }
/* ========================== */

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=cv.clientHeight||window.innerHeight; // canvas sits above the reserved ad banner
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U=Math.min(H/12,W/8);          // world unit scales with screen
  // [view-fix-v9] mobile view adjustments apply ONLY on real touch phones in portrait (touch input AND W<H
  // AND W<=500 CSS px). Every other device/window (desktop of any size/aspect) uses the original rules:
  // U=min(H/12,W/8), PX=2.5, GROUND=0.78H.
  // On phones: MIN_VIEW=12.5 units across [view-fix-v12] (v9 12.25 ~70px, v10 9.6 ~89px, v11 10.2 ~84px
  // were too zoomed in; now ~68px tall at 390 wide),
  // player moved left (PX = W/U-REACT_SEC*START_SPD clamped 1.4..2.5 -> 1.4, max look-ahead), ground 0.70H.
  PX=2.5;GROUND=H*0.78;
  var touch=false;try{touch=(window.matchMedia&&matchMedia('(pointer: coarse)').matches)||('ontouchstart' in window)||(navigator.maxTouchPoints>0)}catch(e){}
  TOUCH=touch;MOBILE=touch&&W<H&&W<=500;
  if(MOBILE){
    if(W/U<MIN_VIEW)U=W/MIN_VIEW;
    if(W/U<24)PX=Math.max(1.4,Math.min(2.5,W/U-REACT_SEC*START_SPD));
    GROUND=H*0.70;
  }
  if(p)p.x=PX;
  if(typeof sizePreview==='function'&&state==='shop')sizePreview();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200)});

/* ===== SHOP ITEMS & SAVE DATA (localStorage) =====
   Points: each coin = COIN_PTS, plus 1 point per DIST_DIV distance points (head-start distance excluded). */
var COIN_PTS=5,DIST_DIV=10,MAX_BOOST=9,HEAD_DIST=500; // HEAD_DIST 500 world units = +250 score
/* ===== WEAPONS (shop, buy once, unlimited use) =====
   kind 'throw' = projectile flying forward (vx units/s relative to the ninja, range in units),
   kind 'slash' = short arc in front (reach units, lasts dur s). brk = breaks a whole crate stack in one hit
   (kunai knocks off one box per hit). cd = cooldown in seconds. KILL_BONUS = score per destroyed obstacle. */
var WEAPONS={
 kunai: {price:3000,kind:'throw',cd:0.35,vx:22,range:11,brk:false},
 katana:{price:5000,kind:'slash',cd:0.45,reach:2.7,dur:0.2,brk:true},
 axe:   {price:7500,kind:'throw',cd:0.5, vx:15,range:15,brk:true}
};
var KILL_BONUS=10;
var RAR={C:{n:'Common',c:'#b7c6d6'},R:{n:'Rare',c:'#4ea8ff'},E:{n:'Epic',c:'#c77dff'},L:{n:'Legendary',c:'#ffc233'}};
var ITEMS=[
 {id:'o_black', cat:'outfit',name:'Classic Black',price:0,   r:'C',body:'#141418'},
 {id:'o_red',   cat:'outfit',name:'Crimson',      price:300, r:'C',body:'#c0182a'},
 {id:'o_blue',  cat:'outfit',name:'Azure',        price:600, r:'R',body:'#1f63d1'},
 {id:'o_shadow',cat:'outfit',name:'Shadow',       price:1500,r:'E',body:'#2a0f3e',glow:'#b56cff'},
 {id:'o_gold',  cat:'outfit',name:'Gold',         price:4000,r:'L',body:'#e2a90f',glow:'#fff0a0',light:true},
 {id:'h_red',   cat:'band',name:'Red Band',   price:0,   r:'C',col:'#e0242f'},
 {id:'h_blue',  cat:'band',name:'Blue Band',  price:150, r:'C',col:'#2f8cff'},
 {id:'h_white', cat:'band',name:'White Band', price:400, r:'R',col:'#f4f4f4'},
 {id:'h_purple',cat:'band',name:'Purple Band',price:900, r:'E',col:'#a64dff'},
 {id:'h_gold',  cat:'band',name:'Gold Band',  price:2500,r:'L',col:'#ffcc33'},
 {id:'t_none',   cat:'trail',name:'No Trail',price:0,   r:'C',kind:''},
 {id:'t_sparkle',cat:'trail',name:'Sparkle', price:500, r:'R',kind:'sparkle'},
 {id:'t_snow',   cat:'trail',name:'Snow',    price:1000,r:'E',kind:'snow'},
 {id:'t_fire',   cat:'trail',name:'Fire',    price:2000,r:'L',kind:'fire'},
 {id:'w_kunai', cat:'weapon',name:'Kunai',      price:WEAPONS.kunai.price, r:'R',wk:'kunai', desc:'Thrown blade. 2-3 hits break a stack'},
 {id:'w_katana',cat:'weapon',name:'Katana',     price:WEAPONS.katana.price,r:'E',wk:'katana',desc:'Close slash, breaks whole stacks'},
 {id:'w_axe',   cat:'weapon',name:'Battle Axe', price:WEAPONS.axe.price,   r:'L',wk:'axe',   desc:'Long-range spinning throw, breaks stacks'},
 {id:'b_magnet',cat:'boost',name:'Coin Magnet',price:100,r:'C',key:'magnet',desc:'Pulls coins to you for one run'},
 {id:'b_shield',cat:'boost',name:'Shield',     price:150,r:'R',key:'shield',desc:'Survive one hit'},
 {id:'b_head',  cat:'boost',name:'Head Start', price:250,r:'R',key:'head',  desc:'Start 250 points ahead'}
];
var ITEM={};ITEMS.forEach(function(it){ITEM[it.id]=it});
var CATS=[['outfit','Ninja outfits',''],['band','Headbands',''],['trail','Trails',''],['weapon','Weapons','buy once, unlimited use: \u2192 key or the attack button'],['boost','Boosts','one-time, used at the start of your next run']];
var SAVE_KEY='ninjaRunnerSave_v1';
function defSave(){return {points:0,owned:{o_black:1,h_red:1,t_none:1},equip:{outfit:'o_black',band:'h_red',trail:'t_none',weapon:''},boosts:{shield:0,magnet:0,head:0},runs:0}}
function loadSave(){
  var d=defSave();
  try{var s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(s&&typeof s==='object'){
      d.points=Math.max(0,Math.floor(+s.points||0));d.runs=Math.max(0,s.runs|0);
      if(s.owned)for(var k in s.owned)if(ITEM[k]&&ITEM[k].cat!=='boost'&&s.owned[k])d.owned[k]=1;
      if(s.equip)for(var e in d.equip){var v=s.equip[e];if(ITEM[v]&&ITEM[v].cat===e&&d.owned[v])d.equip[e]=v}
      if(s.boosts)for(var b in d.boosts)d.boosts[b]=Math.max(0,Math.min(MAX_BOOST,s.boosts[b]|0));
    }}catch(err){}
  return d;
}

function clonePal(s){var o={};for(var k in s){o[k]=Array.isArray(s[k])?s[k].slice():s[k]}return o}
function mixPal(a,b,f){var o={};for(var k in b){if(k==='name'){o[k]=b[k];continue}
  if(Array.isArray(b[k])){var r=[];for(var i=0;i<b[k].length;i++){var av=a[k][i]===undefined?1:a[k][i];r.push(av+(b[k][i]-av)*f)}o[k]=r}
  else o[k]=a[k]+(b[k]-a[k])*f}return o}
function rgb(c,mulA){var a=(c.length>3?c[3]:1)*(mulA===undefined?1:mulA);return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a.toFixed(3)+')'}
var pal=clonePal(STAGES[0]),palFrom=clonePal(STAGES[0]),stageIdx=0,stageK=1,labelT=0,TRANS_SEC=2.5;
function stageFor(s){return Math.floor(s/STAGE_PTS)%STAGES.length}
function updStage(dt){
  var target=stageFor(score());
  if(target!==stageIdx){palFrom=clonePal(pal);stageIdx=target;stageK=0;if(state==='play')labelT=2.2}
  if(stageK<1){stageK=Math.min(1,stageK+dt/TRANS_SEC);var e=stageK*stageK*(3-2*stageK);pal=mixPal(palFrom,STAGES[stageIdx],e)}
  if(labelT>0)labelT-=dt;
}

for(i0=0;i0<110;i0++)flakes.push({x:Math.random(),y:Math.random(),r:0.6+Math.random()*1.4,ph:Math.random()*6.28,s:0.5+Math.random()*0.6});
for(i0=0;i0<90;i0++)stars.push({x:Math.random(),y:Math.random()*0.62,r:0.5+Math.random()*1.3,ph:Math.random()*6.28});
function updWeather(dt){
  if(pal.rainA>0.01)for(var i=0;i<drops.length;i++){var d=drops[i];d.y+=dt*1.6*d.s;d.x-=dt*0.25*d.s;if(d.y>1){d.y-=1.05;d.x=Math.random()*1.2}if(d.x<-0.05)d.x+=1.1}
  if(pal.snowA>0.01)for(var j=0;j<flakes.length;j++){var f=flakes[j];f.y+=dt*0.12*f.s;f.ph+=dt*1.5;f.x+=Math.sin(f.ph)*dt*0.02-dt*0.03*f.s;if(f.y>1.02){f.y=-0.02;f.x=Math.random()}if(f.x<-0.02)f.x+=1.04}
}

var state='start',hs=loadHS(),shopFrom='start',lastScore=0,clk=0;
var p,obs,coins,speed,dist,coinCount,spawnGap,t,lastT=0,particles,trail,trailAcc,deadT,nextType,run,shots,slash,pops,forceType=null;
var BASE_SPEED=6,MAX_SPEED=16,GRAV=38,JUMP_V=-14.5,DJ_V=-14.5,SLIDE_TIME=0.65,MAX_JUMPS=2;
// single jump peak = JUMP_V^2/(2*GRAV) ~ 2.77 units; tall stack is 3.2 so it needs the double jump
var BOX_W=1.3,BOX_H=1.6;
/* THREE-BOX STACK ('stack3'): 3 x 1.35 = 4.05 tall (two-box stack is 3.2). Single jump peak 2.77 can't clear it; a
   double jump (peak 5.53) clears it when the take-off is 0.37-0.83 s (speed 6) / 0.37-1.03 s (speed 16) before
   reaching it, best with the 2nd jump near the top of the first. Appears from STACK3_PTS score.
   On phones (short look-ahead) it spawns further out so it arrives STACK3_LEAD s after spawning, with an
   edge warning marker while it is still off-screen.
   FLYING SHURIKEN ('shur'): 0.6 x 0.6 hitbox, flies SHUR_EXTRA (30%) faster than the ground scroll, spawned further
   out so it reaches the ninja at the same moment a ground obstacle spawned at the screen edge would (normal spacing).
   high: 1.25..1.85 (above slide height 0.9, below standing 2.2) -> slide (or jump); low: 0.15..0.75 -> jump. */
var BOX3_H=1.35,STACK3_PTS=2500,STACK3_LEAD=0.95,SHUR_PTS=300,SHUR_EXTRA=0.3,SHUR_S=0.6,SHUR_HI=1.25,SHUR_LO=0.15;

function reset(){
  p={x:PX,y:0,vy:0,onGround:true,slide:0,phase:0,jumps:0,djT:9};
  obs=[];coins=[];particles=[];trail=[];trailAcc=0;shots=[];slash=null;pops=[];
  speed=BASE_SPEED;dist=0;coinCount=0;spawnGap=8;t=0;nextType=pickType(0);
  run={shield:0,magnet:0,inv:0,headDist:0,earned:0,banner:0,bannerTxt:'',rewarded:false,bonus:0,kills:0,cd:0};
  p.atkT=0;
}
// start a run: consumes one of each boost the player bought in the shop
function startRun(){
  reset();
  var used=[];
  if(save.boosts.shield>0){save.boosts.shield--;run.shield=1;used.push('Shield')}
  if(save.boosts.magnet>0){save.boosts.magnet--;run.magnet=1;used.push('Coin Magnet')}
  if(save.boosts.head>0){save.boosts.head--;run.headDist=HEAD_DIST;dist=HEAD_DIST;spawnGap=dist+8;used.push('Head Start')}
  if(used.length){persist();run.banner=2.6;run.bannerTxt=used.join(' + ')+' active!'}
  state='play';
}

// player hitbox in world units (y up from ground, positive = above)
function pBox(){
  if(p.slide>0) return {x:p.x-0.5,w:1.1,y0:p.y,y1:p.y+0.9};
  return {x:p.x-0.35,w:0.7,y0:p.y,y1:p.y+2.2};
}

function jump(){
  if(state!=='play')return;
  if(p.onGround){p.vy=JUMP_V;p.onGround=false;p.slide=0;p.jumps=1}
  else if(p.jumps<MAX_JUMPS){p.vy=DJ_V;p.slide=0;p.jumps=MAX_JUMPS;p.djT=0;burst(p.x,p.y,curCos().band,8)} // one extra mid-air jump
}
function slide(){
  if(state!=='play')return;
  if(p.onGround){p.slide=SLIDE_TIME}
  else{p.vy=Math.max(p.vy,14);p.slide=SLIDE_TIME} // fast-fall into slide
}
function handleStartRestart(){
  if(AdService.isOpen())return;
  if(state==='start'){startRun()}
  else if(state==='over'&&performance.now()-deadT>500){startRun()}
}

// tall stack: never in the first 150 pts, then 10% rising to 30% by ~1150 pts
// flying shuriken from 300 pts (8% rising to 24%), three-box stack from 2500 pts (6% rising to 16%)
function pickType(s){
  if(forceType){var ft=forceType;forceType=null;return ft}
  var st3=s<STACK3_PTS?0:Math.min(0.16,0.06+(s-STACK3_PTS)/25000),shP=s<SHUR_PTS?0:Math.min(0.24,0.08+(s-SHUR_PTS)/12500);
  if(st3||shP){var r0=Math.random();if(r0<st3)return 'stack3';if(r0<st3+shP)return 'shur'}
  var stackP=s<150?0:Math.min(0.30,0.10+(s-150)/5000);
  var r=Math.random();
  if(r<stackP)return 'stack';
  r=Math.random();
  return r<0.35?'crate':(r<0.65?'cone':'beam');
}
// spawning: obstacles spaced by time-to-react so always passable.
// gap = seconds of travel between leading edges (time-based, so it scales with speed)
// (types keep their old names: crate = wooden crate, stack = two crates, cone = spike trap, beam = hanging bamboo log)
function spawn(){
  var x=dist+W/U+2,type=nextType,o,shDelay=0;
  if(type==='stack') o={type:'stack',x:x,w:BOX_W,h:BOX_H*2,y0:0,boxes:2,bh:BOX_H};
  else if(type==='stack3'){
    if(MOBILE&&W/U<20)x=Math.max(x,dist+PX+0.35+STACK3_LEAD*speed); // phones: spawn further out (edge marker shows it)
    o={type:'stack3',x:x,w:BOX_W,h:BOX3_H*3,y0:0,boxes:3,bh:BOX3_H};
  }else if(type==='shur'){var hi=Math.random()<0.5;
    // starts further right so it arrives together with a ground object spawned at x (x stays the spacing reference)
    var sD=(x-dist-PX)*(1+SHUR_EXTRA),sNeed=W/U-PX+0.4*(1+SHUR_EXTRA)*speed;
    // phones: start further out so the edge marker shows >= 0.4 s; later spacing is pushed back by the same delay
    if(MOBILE&&W/U<20&&sD<sNeed){shDelay=(sNeed-sD)/((1+SHUR_EXTRA)*speed);sD=sNeed}
    o={type:'shur',x:dist+PX+sD,w:SHUR_S,h:SHUR_S,y0:hi?SHUR_HI:SHUR_LO,hi:hi,rot:Math.random()*6.28};
  }
  else if(type==='crate') o={type:'crate',x:x,w:1.0,h:1.0,y0:0};
  else if(type==='cone') o={type:'cone',x:x,w:0.8,h:1.1,y0:0};
  else o={type:'beam',x:x,w:1.6,h:0.5,y0:1.25}; // gap under = 1.25 > slide height 0.9, < stand 2.2
  obs.push(o);
  // optional coins (above stack they need the double jump)
  if(o.type!=='shur'&&Math.random()<0.55){
    var cy=o.type==='beam'?0.45:(o.type==='stack'?4.4:(o.type==='stack3'?4.9:2.9)), n=3;
    for(var i=0;i<n;i++) coins.push({x:x-0.9+i*0.9+o.w/2,y:cy,got:false});
  }
  nextType=pickType(score());
  // single jump airtime ~0.76s; worst-case double-jump airtime ~1.3s
  var minSec=0.95;
  if(type==='stack')minSec=1.75;          // land from double jump, then react
  if(type==='stack3')minSec=1.9;
  if(nextType==='stack')minSec=Math.max(minSec,1.5); // land previous + early take-off for stack
  if(nextType==='stack3')minSec=Math.max(minSec,1.6);
  if(nextType==='shur'&&(type==='stack'||type==='stack3'))minSec=Math.max(minSec,2.0); // land the double jump first
  // [view-fix-v9] reduced view (touch phones in portrait only): the obstacle before a stack must be past the player
  // before the stack scrolls into view, so the whole visible look-ahead is free for the stack
  if(MOBILE&&nextType==='stack'&&W/U<20)minSec=Math.max(minSec,(W/U-PX+o.w+1.5)/speed);
  // phones: the obstacle before a three-box stack is passed (and landed) before the stack even spawns
  if(MOBILE&&nextType==='stack3'&&W/U<20)minSec=Math.max(minSec,(W/U+2-PX+0.35)/speed+(type==='stack'||type==='stack3'?1.0:0.5));
  var big=type==='stack'||nextType==='stack'||type==='stack3'||nextType==='stack3';
  var extra=Math.random()*(big?0.8:1.1);
  spawnGap=x+speed*(minSec+extra+shDelay)+o.w-(W/U+2);
}

function hit(a,o){
  var ox=o.x-dist,oy0=o.y0,oy1=o.y0+o.h,ow=o.w;
  if(o.type==='cone'){ox+=0.15;ow-=0.3;oy1-=0.15}
  return a.x<ox+ow&&a.x+a.w>ox&&a.y0<oy1&&a.y1>oy0;
}

function update(dt){
  t+=dt;clk+=dt;
  updStage(dt);updWeather(dt);
  if(state!=='play'){p.phase+=dt*(state==='start'||state==='shop'?8:0);updParticles(dt);updTrail(dt,false);return}
  speed=Math.min(MAX_SPEED,BASE_SPEED+t*0.12);
  dist+=speed*dt;
  // physics
  if(!p.onGround){p.vy+=GRAV*dt;p.y-=p.vy*dt;if(p.y<=0){p.y=0;p.vy=0;p.onGround=true;p.jumps=0}}
  if(p.slide>0){p.slide-=dt;if(keys.down&&p.onGround)p.slide=Math.max(p.slide,0.05)}
  p.phase+=dt*speed*1.3;p.djT+=dt;
  if(run.inv>0)run.inv-=dt;
  if(run.banner>0)run.banner-=dt;
  if(dist>=spawnGap) spawn();
  if(run.cd>0)run.cd-=dt;
  if(p.atkT>0)p.atkT-=dt;
  updWeapons(dt);
  var b=pBox();
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];
    if(o.type==='shur'){o.x-=SHUR_EXTRA*speed*dt;o.rot-=dt*15}
    if(o.x-dist<-3){obs.splice(i,1);continue}
    if(!o.dead&&run.inv<=0&&hit(b,o)){
      if(run.shield>0){run.shield=0;o.dead=true;run.inv=1.0;burst(p.x,p.y+1.1,'#7cc4ff',18);run.banner=1.4;run.bannerTxt='Shield saved you!'}
      else{die();return}
    }
  }
  for(var j=coins.length-1;j>=0;j--){
    var c=coins[j],cx=c.x-dist;
    if(cx<-3){coins.splice(j,1);continue}
    if(run.magnet&&!c.got&&cx-p.x<6&&cx-p.x>-1.5){var k=Math.min(1,dt*7);c.x+=(p.x+dist-c.x)*k;c.y+=(p.y+1.1-c.y)*k;cx=c.x-dist}
    if(!c.got&&Math.abs(cx-p.x)<0.6&&c.y>b.y0-0.3&&c.y<b.y1+0.3){c.got=true;coinCount++;burst(cx,c.y,rgb(pal.coin),6)}
  }
  updParticles(dt);updTrail(dt,true);
  for(var pq=pops.length-1;pq>=0;pq--){pops[pq].l-=dt;pops[pq].y+=dt*1.6;if(pops[pq].l<=0)pops.splice(pq,1)}
}
function score(){return Math.floor(dist/2)+coinCount*10+(run&&run.bonus||0)}

/* ===== WEAPON ATTACKS ===== */
function weapon(){var id=save.equip.weapon;return id&&ITEM[id]&&save.owned[id]?ITEM[id]:null}
function attack(){
  if(state!=='play')return false;
  var w=weapon();if(!w||run.cd>0)return false;
  var S=WEAPONS[w.wk],low=p.slide>0&&p.onGround;
  run.cd=S.cd;p.atkT=0.22;
  if(S.kind==='slash')slash={t:S.dur,d:S.dur,reach:S.reach,hit:[]};
  else shots.push({k:w.wk,x:p.x+0.45,x0:p.x+0.45,y:p.y+(low?0.55:1.35),vx:S.vx,range:S.range,brk:S.brk,rot:0});
  return true;
}
function boxHit(ax0,ax1,ay0,ay1,o){var ox=o.x-dist;return ax0<ox+o.w&&ax1>ox&&ay0<o.y0+o.h&&ay1>o.y0}
function debris(o,n){
  var cols=o.type==='cone'||o.type==='shur'?[rgb(pal.steel),rgb(pal.woodDark)]:(o.type==='beam'?[rgb(pal.log),rgb(pal.logDark)]:[rgb(pal.wood),rgb(pal.woodDark)]);
  var ox=o.x-dist;
  for(var i=0;i<n;i++)particles.push({x:ox+Math.random()*o.w,y:o.y0+Math.random()*o.h,vx:(Math.random()-0.3)*7-speed*0.35,vy:2+Math.random()*7,l:0.5+Math.random()*0.5,c:cols[i%2]});
}
function damage(o,brk){
  var idx=obs.indexOf(o);if(idx<0)return;
  if(!brk&&o.boxes>1){ // kunai: knock off the top box, crack the rest
    var top={type:o.type,x:o.x,w:o.w,y0:o.y0+o.h-o.bh,h:o.bh};debris(top,12);
    o.boxes--;o.h-=o.bh;o.dmg=(o.dmg||0)+1;return}
  obs.splice(idx,1);debris(o,o.boxes?10+o.boxes*6:14);
  run.bonus+=KILL_BONUS;run.kills++;pops.push({x:o.x-dist+o.w/2,y:o.y0+o.h+0.3,l:0.8});
}
function updWeapons(dt){
  var i,j,o;
  for(i=shots.length-1;i>=0;i--){var q=shots[i];q.x+=q.vx*dt;q.rot+=dt*(q.k==='axe'?-18:0);
    if(q.x-q.x0>q.range||q.x>W/U+1){shots.splice(i,1);continue}
    var tgt=null;for(j=0;j<obs.length;j++){o=obs[j];if(!o.dead&&boxHit(q.x-0.4,q.x+0.4,q.y-0.9,q.y+0.9,o)&&(!tgt||o.x<tgt.x))tgt=o}
    if(tgt){damage(tgt,q.brk);shots.splice(i,1)}}
  if(slash){slash.t-=dt;
    for(j=obs.length-1;j>=0;j--){o=obs[j];if(!o.dead&&slash.hit.indexOf(o)<0&&boxHit(p.x+0.1,p.x+slash.reach,p.y-0.3,p.y+2.9,o)){slash.hit.push(o);damage(o,true)}}
    if(slash.t<=0)slash=null}
}
function pointsFor(){return coinCount*COIN_PTS+Math.floor(Math.max(0,Math.floor((dist-run.headDist)/2))/DIST_DIV)}
function die(){
  state='over';deadT=performance.now();
  var C=curCos();burst(p.x,p.y+1.2,C.body,14);burst(p.x,p.y+1.6,C.band,10);
  var s=score();lastScore=s;run.newBest=s>hs&&s>0;if(s>hs){hs=s;saveHS(hs)}
  run.earned=pointsFor();save.points+=run.earned;save.runs++;persist();
  showAd(); // <-- ad placeholder hook
}
function burst(x,y,col,n){for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:(Math.random()-0.5)*8,vy:Math.random()*8,l:0.6+Math.random()*0.4,c:col})}
function updParticles(dt){for(var i=particles.length-1;i>=0;i--){var q=particles[i];q.l-=dt;q.vy-=20*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.l<=0)particles.splice(i,1)}}
// cosmetic trail (shop item): particles left behind in the world
function updTrail(dt,emit){
  var kind=ITEM[save.equip.trail].kind;
  if(emit&&kind){trailAcc+=dt*45;
    while(trailAcc>=1){trailAcc--;var low=p.slide>0&&p.onGround,ml=0.35+Math.random()*0.2;
      trail.push({x:p.x-0.25+Math.random()*0.2,y:p.y+(low?0.45:1.1)+(Math.random()-0.5)*0.7,vx:-speed*(0.75+Math.random()*0.25),vy:kind==='fire'?1.5+Math.random():(kind==='snow'?-0.8:(Math.random()-0.5)),l:ml,ml:ml,k:kind,s:0.14+Math.random()*0.1,sd:Math.random()*10})}}
  for(var i=trail.length-1;i>=0;i--){var q=trail[i];q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.l<=0)trail.splice(i,1)}
}

// world -> screen
function sx(x){return x*U}
function sy(y){return GROUND-y*U}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

/* ===== NINJA (drawn on any 2D context g, so the shop preview/icons reuse it) ===== */
function curCos(over){var o=ITEM[save.equip.outfit],b=ITEM[save.equip.band];over=over||{};
  var oo=over.outfit?ITEM[over.outfit]:o,bb=over.band?ITEM[over.band]:b;
  return {body:oo.body,glow:oo.glow,band:bb.col,sword:'#5b636e',halo:oo.light?'rgba(30,18,0,0.75)':(over.halo||rgb(pal.nHalo))}}
function nLimb(g,ax,ay,a1,l1,a2,l2){
  var bx=ax+Math.sin(a1)*l1,by=ay+Math.cos(a1)*l1;
  g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.lineTo(bx+Math.sin(a2)*l2,by+Math.cos(a2)*l2);g.stroke();
}
// pose geometry; limb angles: 0 = straight down, + = forward (right)
function ninjaGeom(x,gy,u,P){
  var G;
  if(P.k==='slide'){
    G={hip:[x-0.1*u,gy-0.35*u],sh:[x-0.75*u,gy-0.75*u],hr:0.22*u,
      legs:[[1.35,0.55,1.55,0.55],[1.0,0.45,2.2,0.4]],arms:[[0.6,0.4,1.2,0.35],[1.9,0.4,2.35,0.35]]};
    G.head=[G.sh[0]-0.26*u,G.sh[1]-0.14*u];
  }else if(P.k==='jump'||P.k==='dj'){
    var dj=P.k==='dj';
    G={hip:[x,gy-1.0*u],sh:[x+0.12*u,gy-1.75*u],hr:0.25*u,
      legs:dj?[[1.3,0.46,-0.7,0.42],[0.7,0.46,-1.0,0.42]]:[[0.9,0.5,-0.3,0.45],[0.3,0.5,-0.6,0.45]],
      arms:dj?[[1.9,0.38,0.5,0.32],[1.4,0.38,0.2,0.32]]:[[1.7,0.4,2.3,0.35],[-1.6,0.4,-1.0,0.35]]};
    G.head=[G.sh[0]+0.12*u,G.sh[1]-0.3*u];
    if(dj){G.rot=P.rot||0;G.cx=x;G.cy=gy-1.35*u}
  }else{ // run: forward lean, arms swept back (ninja run)
    var ph=P.ph||0,s=Math.sin(ph),c2=Math.sin(ph+Math.PI),bob=Math.abs(Math.cos(ph))*0.06*u;
    G={hip:[x,gy-1.0*u-bob],sh:[x+0.3*u,gy-1.7*u-bob],hr:0.25*u,
      legs:[[s*0.8,0.52,s*0.8-0.6-Math.max(0,-s)*0.6,0.5],[c2*0.8,0.52,c2*0.8-0.6-Math.max(0,-c2)*0.6,0.5]],
      arms:[[-1.25+s*0.12,0.42,-1.45+s*0.12,0.38],[-1.12+c2*0.12,0.42,-1.32+c2*0.12,0.38]]};
    G.head=[G.sh[0]+0.18*u,G.sh[1]-0.3*u];
  }
  if(P.atk){if(P.k==='slide')G.arms[1]=[2.2,0.4,2.0,0.35];else G.arms[0]=[1.75,0.42,1.6,0.38]} // throwing / slashing arm forward
  return G;
}
function drawNinja(g,x,gy,u,P,C){
  var G=ninjaGeom(x,gy,u,P),lw=Math.max(2.5,u*0.13),hw=Math.max(1.5,u*0.06),i,pass;
  var hip=G.hip,sh=G.sh,hd=G.head,hr=G.hr,tt=P.tt||0;
  g.save();
  if(G.rot){g.translate(G.cx,G.cy);g.rotate(G.rot);g.translate(-G.cx,-G.cy)}
  g.lineCap='round';g.lineJoin='round';
  // headband tails flutter behind the head
  var kx=hd[0]-hr*0.85,ky=hd[1]-hr*0.28,tails=[[],[]];
  for(i=0;i<=7;i++){var f=i/7;
    tails[0].push([kx-f*u*0.95,ky+f*u*0.12+Math.sin(tt*14-f*5)*u*0.13*f]);
    tails[1].push([kx-f*u*0.78,ky+f*u*0.34+Math.sin(tt*14-f*5+1.7)*u*0.11*f])}
  function tailPath(T){g.beginPath();g.moveTo(T[0][0],T[0][1]);for(var j=1;j<T.length;j++)g.lineTo(T[j][0],T[j][1]);g.stroke()}
  // sword strapped on the back
  var swA=[sh[0]-0.48*u,sh[1]-0.32*u],swB=[hip[0]+0.18*u,hip[1]-0.12*u];
  for(pass=0;pass<2;pass++){
    var col=pass?C.body:C.halo,w=pass?lw:lw+hw*2;
    if(pass){ // tails in band colour, drawn before the body so the knot sits behind the head
      g.strokeStyle=C.band;g.lineWidth=Math.max(2,u*0.1);tailPath(tails[0]);tailPath(tails[1]);
      g.strokeStyle=C.sword;g.lineWidth=Math.max(2,u*0.075);g.beginPath();g.moveTo(swA[0],swA[1]);g.lineTo(swB[0],swB[1]);g.stroke();
      if(C.glow){g.shadowColor=C.glow;g.shadowBlur=u*0.35}
    }else{
      g.strokeStyle=col;g.lineWidth=Math.max(2,u*0.1)+hw*2;tailPath(tails[0]);tailPath(tails[1]);
      g.lineWidth=Math.max(2,u*0.075)+hw*2;g.beginPath();g.moveTo(swA[0],swA[1]);g.lineTo(swB[0],swB[1]);g.stroke();
    }
    g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;
    for(i=0;i<2;i++){var L=G.legs[i];nLimb(g,hip[0],hip[1],L[0],L[1]*u,L[2],L[3]*u)}
    for(i=0;i<2;i++){var A=G.arms[i];nLimb(g,sh[0],sh[1]+0.05*u,A[0],A[1]*u,A[2],A[3]*u)}
    g.lineWidth=w*1.35;g.beginPath();g.moveTo(hip[0],hip[1]);g.lineTo(sh[0],sh[1]);g.stroke();
    g.beginPath();g.arc(hd[0],hd[1],hr+(pass?0:hw),0,Math.PI*2);g.fill();
    g.shadowBlur=0;
  }
  // headband + eye slit (clipped to the head)
  g.save();g.beginPath();g.arc(hd[0],hd[1],hr,0,Math.PI*2);g.clip();
  g.fillStyle=C.band;g.fillRect(hd[0]-hr,hd[1]-hr*0.62,hr*2,hr*0.4);
  g.fillStyle='#f2c79a';g.fillRect(hd[0]-hr*0.05,hd[1]-hr*0.12,hr*1.1,hr*0.3);
  g.fillStyle='#111';g.beginPath();g.arc(hd[0]+hr*0.55,hd[1]+hr*0.03,Math.max(1,hr*0.11),0,Math.PI*2);g.fill();
  g.restore();
  g.fillStyle=C.band;g.beginPath();g.arc(kx,ky,Math.max(1.5,hr*0.2),0,Math.PI*2);g.fill();
  g.restore();
}
function curPose(){
  var P;
  if(p.slide>0&&p.onGround)P={k:'slide',tt:clk};
  else if(!p.onGround)P=p.jumps>=2?{k:'dj',rot:Math.min(1,p.djT/0.42)*Math.PI*2,tt:clk}:{k:'jump',tt:clk};
  else P={k:'run',ph:p.phase,tt:clk};
  if(p.atkT>0&&P.k!=='dj')P.atk=1;
  return P;
}
function drawPlayer(){
  var a=state==='over'?0.35:1;
  if(state==='play'&&run.inv>0&&Math.sin(clk*40)>0)a=0.4;
  ctx.globalAlpha=a;drawNinja(ctx,sx(p.x),sy(p.y),U,curPose(),curCos());ctx.globalAlpha=1;
  if(state==='play'&&run.shield>0){var cx=sx(p.x),cy=sy(p.y+(p.slide>0&&p.onGround?0.5:1.15)),r=U*(1.25+0.05*Math.sin(clk*6));
    ctx.fillStyle='rgba(120,190,255,0.14)';ctx.strokeStyle='rgba(150,210,255,0.75)';ctx.lineWidth=Math.max(1.5,U*0.05);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.stroke()}
}
// one trail particle (sparkle / snow / fire)
function drawTP(g,kind,x,y,s,a,seed){
  if(a<=0)return;g.save();
  if(kind==='sparkle'){g.globalAlpha=a*(0.55+0.45*Math.sin(seed*7));g.fillStyle='#fff7c2';g.strokeStyle='#ffc93a';g.lineWidth=Math.max(1,s*0.15);
    g.beginPath();for(var i=0;i<8;i++){var r=i%2?s*0.32:s,an=i*Math.PI/4+seed;g.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r)}g.closePath();g.fill();g.stroke()}
  else if(kind==='fire'){g.globalAlpha=Math.min(1,a*1.2);g.fillStyle=a>0.65?'#ffe066':(a>0.35?'#ff8a1f':'#e0301e');g.beginPath();g.arc(x,y,s*(0.45+0.55*a),0,Math.PI*2);g.fill()}
  else if(kind==='snow'){g.globalAlpha=a;g.fillStyle='#ffffff';g.strokeStyle='#7fb2ff';g.lineWidth=Math.max(1,s*0.14);
    g.beginPath();g.arc(x,y,s*0.5,0,Math.PI*2);g.fill();g.stroke();
    g.beginPath();for(var k=0;k<3;k++){var an2=k*Math.PI/3+seed;g.moveTo(x-Math.cos(an2)*s,y-Math.sin(an2)*s);g.lineTo(x+Math.cos(an2)*s,y+Math.sin(an2)*s)}g.stroke()}
  g.restore();
}
function drawTrailSample(g,kind,x,y,u,tm){if(!kind)return;for(var i=9;i>=0;i--){var f=i/9;drawTP(g,kind,x-f*u*2.2,y+Math.sin(tm*8+i*1.3)*u*0.12,u*0.22*(1-f*0.5),1-f*0.85,i*1.7+tm*2)}}
function drawBoostIcon(g,key,cx,cy,r){
  g.save();g.lineJoin='round';g.lineCap='round';
  if(key==='shield'){g.beginPath();g.moveTo(cx,cy-r);g.quadraticCurveTo(cx+r*0.55,cy-r*0.7,cx+r*0.85,cy-r*0.7);g.quadraticCurveTo(cx+r*0.85,cy+r*0.45,cx,cy+r);
    g.quadraticCurveTo(cx-r*0.85,cy+r*0.45,cx-r*0.85,cy-r*0.7);g.quadraticCurveTo(cx-r*0.55,cy-r*0.7,cx,cy-r);g.closePath();
    g.fillStyle='#3d8bff';g.fill();g.lineWidth=Math.max(1.5,r*0.14);g.strokeStyle='#ffffff';g.stroke();
    g.beginPath();g.moveTo(cx,cy-r*0.55);g.lineTo(cx,cy+r*0.5);g.moveTo(cx-r*0.42,cy-r*0.1);g.lineTo(cx+r*0.42,cy-r*0.1);g.stroke()}
  else if(key==='magnet'){var m=r*0.55;
    g.lineWidth=r*0.62;g.strokeStyle='#ffffff';g.beginPath();g.moveTo(cx-m,cy-r*0.75);g.lineTo(cx-m,cy);g.arc(cx,cy,m,Math.PI,0,true);g.lineTo(cx+m,cy-r*0.75);g.stroke();
    g.lineWidth=r*0.42;g.strokeStyle='#e53935';g.beginPath();g.moveTo(cx-m,cy-r*0.4);g.lineTo(cx-m,cy);g.arc(cx,cy,m,Math.PI,0,true);g.lineTo(cx+m,cy-r*0.4);g.stroke();
    g.strokeStyle='#d8dde4';g.beginPath();g.moveTo(cx-m,cy-r*0.75);g.lineTo(cx-m,cy-r*0.45);g.moveTo(cx+m,cy-r*0.75);g.lineTo(cx+m,cy-r*0.45);g.stroke()}
  else{ // head start: double chevron
    g.lineWidth=r*0.5;g.strokeStyle='#ffffff';
    for(var pass=0;pass<2;pass++){g.beginPath();for(var k=0;k<2;k++){var ox=cx-r*0.55+k*r*0.62;g.moveTo(ox-r*0.2,cy-r*0.6);g.lineTo(ox+r*0.32,cy);g.lineTo(ox-r*0.2,cy+r*0.6)}g.stroke();g.lineWidth=r*0.28;g.strokeStyle='#ff8a1f'}}
  g.restore();
}
function drawCoin(g,x,y,r,col,ol){
  g.fillStyle=col;g.strokeStyle=ol;g.lineWidth=Math.max(1.5,r*0.22);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.stroke();
  var q=r*0.32;g.fillStyle='rgba(90,55,0,0.55)';g.fillRect(x-q,y-q,q*2,q*2);g.lineWidth=Math.max(1,r*0.12);g.strokeRect(x-q,y-q,q*2,q*2);
}

/* ===== OBSTACLES (same hitboxes as before, ninja styling) ===== */
function objHalo(x,y,w,h){if(pal.objHalo[3]>0.02){ctx.strokeStyle=rgb(pal.objHalo);ctx.lineWidth=Math.max(3,U*0.2);ctx.strokeRect(x,y,w,h)}}
function drawCrate(x,y,w,h){
  var lw=Math.max(2,U*0.07),m=Math.min(w,h)*0.13;
  objHalo(x,y,w,h);
  ctx.fillStyle=rgb(pal.wood);ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=rgb(pal.woodDark);ctx.lineWidth=Math.max(1,lw*0.45);
  for(var i=1;i<4;i++)line(x+m,y+h*i/4,x+w-m,y+h*i/4);            // planks
  ctx.fillStyle=rgb(pal.woodDark);                                // frame
  ctx.fillRect(x,y,w,m);ctx.fillRect(x,y+h-m,w,m);ctx.fillRect(x,y,m,h);ctx.fillRect(x+w-m,y,m,h);
  ctx.strokeStyle=rgb(pal.woodDark);ctx.lineWidth=m*0.9;ctx.lineCap='butt';line(x+m,y+h-m,x+w-m,y+m); // brace
  ctx.fillStyle='rgba(255,240,210,0.8)';var n=Math.max(1.5,m*0.22);
  ctx.fillRect(x+m*0.5-n/2,y+m*0.5-n/2,n,n);ctx.fillRect(x+w-m*0.5-n/2,y+m*0.5-n/2,n,n);ctx.fillRect(x+m*0.5-n/2,y+h-m*0.5-n/2,n,n);ctx.fillRect(x+w-m*0.5-n/2,y+h-m*0.5-n/2,n,n);
  ctx.strokeStyle=rgb(pal.outline);ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);
}
// four-point shuriken centred at (cx,cy), radius r, spin rot
function drawShuriken(g,cx,cy,r,rot,fill,ol,hl){
  g.save();g.translate(cx,cy);g.rotate(rot);g.lineJoin='miter';
  g.beginPath();
  for(var i=0;i<4;i++){var a=i*Math.PI/2,b=a+Math.PI/4;
    g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    g.quadraticCurveTo(Math.cos(b-0.25)*r*0.42,Math.sin(b-0.25)*r*0.42,Math.cos(b)*r*0.3,Math.sin(b)*r*0.3);
    g.quadraticCurveTo(Math.cos(b+0.15)*r*0.38,Math.sin(b+0.15)*r*0.38,Math.cos(a+Math.PI/2)*r,Math.sin(a+Math.PI/2)*r)}
  g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=ol;g.lineWidth=Math.max(1.2,r*0.1);g.stroke();
  if(hl){g.strokeStyle=hl;g.lineWidth=Math.max(1,r*0.07);for(var k=0;k<4;k++){var c=k*Math.PI/2;g.beginPath();g.moveTo(Math.cos(c)*r*0.3,Math.sin(c)*r*0.3);g.lineTo(Math.cos(c)*r*0.85,Math.sin(c)*r*0.85);g.stroke()}}
  g.fillStyle=ol;g.beginPath();g.arc(0,0,r*0.16,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(255,255,255,0.35)';g.beginPath();g.arc(0,0,r*0.07,0,Math.PI*2);g.fill();
  g.restore();
}
// crate stack with n boxes (bottom full width, each higher box slightly inset); dmg = kunai cracks
function drawStackN(x,y,w,h,n,dmg){
  var bh=h/n,i;
  for(i=0;i<n;i++){var ins=0.04*i;drawCrate(x+w*ins,y+h-(i+1)*bh,w*(1-2*ins),bh)}
  ctx.strokeStyle=rgb(pal.rope);ctx.lineWidth=Math.max(2,U*0.08);line(x+w*0.5,y,x+w*0.5,y+h);
  if(dmg){ctx.strokeStyle='rgba(20,10,0,0.85)';ctx.lineWidth=Math.max(1.5,U*0.05);ctx.lineCap='round';
    for(var k=0;k<Math.min(3,dmg);k++){var cx=x+w*(0.25+0.3*k),cy=y+bh*0.1;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+w*0.1,cy+bh*0.25);ctx.lineTo(cx-w*0.05,cy+bh*0.45);ctx.lineTo(cx+w*0.08,cy+bh*0.7);ctx.stroke()}
    ctx.lineCap='butt'}
}
function drawObs(o){
  var x=sx(o.x-dist),y=sy(o.y0+o.h),w=o.w*U,h=o.h*U;
  ctx.lineJoin='miter';ctx.lineCap='butt';
  if(o.dead)ctx.globalAlpha=0.3;
  if(o.type==='crate'){
    drawCrate(x,y,w,h);
  }else if(o.type==='shur'){
    var scx=x+w/2,scy=y+h/2,sr=U*0.4,fillS=rgb(pal.steel),olS=rgb(pal.outline);
    // faint motion trail: streaks + fading ghost copies behind (it flies to the left)
    var tg=ctx.createLinearGradient(scx,0,scx+U*2.2,0);tg.addColorStop(0,rgb(pal.objHalo[3]>0.02?pal.objHalo:pal.steel,0.55));tg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=tg;ctx.lineCap='round';ctx.lineWidth=Math.max(1.5,U*0.06);
    line(scx+sr*0.3,scy-sr*0.55,scx+U*2.0,scy-sr*0.55);line(scx+sr*0.5,scy,scx+U*2.4,scy);line(scx+sr*0.3,scy+sr*0.55,scx+U*1.8,scy+sr*0.55);ctx.lineCap='butt';
    for(var gk=3;gk>=1;gk--){ctx.globalAlpha=(o.dead?0.3:1)*0.16*(4-gk)/3;drawShuriken(ctx,scx+gk*U*0.38,scy,sr,o.rot+gk*0.45,fillS,olS)}
    ctx.globalAlpha=o.dead?0.3:1;

  ui.bal.textContent='\u2605 '+save.points+' points';ui.chip.textContent='\u2605 '+save.points+' pts';
  cards.forEach(function(c){var it=c.it,cls='card',lab;
    if(it.cat==='boost'){var n=save.boosts[it.key]||0;lab='Buy \u2022 '+it.price;cls+=save.points>=it.price&&n<MAX_BOOST?' buy':' poor';
      c.cnt.textContent='x'+n+' ready';c.cnt.classList.toggle('hidden',!n)}
    else if(save.equip[it.cat]===it.id){lab='Equipped \u2713';cls+=' eq'}
    else if(save.owned[it.id]){lab='Owned \u2022 Equip'}
    else{lab='Buy \u2022 '+it.price;cls+=save.points>=it.price?' buy':' poor'}
    if(c.el.className.indexOf('shake')>=0)cls+=' shake';
    c.el.className=cls;c.act.textContent=lab;

function activate(id,el){
  var it=ITEM[id];if(!it)return false;
  if(it.cat==='boost'){
    var n=save.boosts[it.key]||0;
    if(n>=MAX_BOOST){toast('You already hold the maximum ('+MAX_BOOST+')',true);shake(el);return false}
    if(save.points<it.price){toast('Not enough points - need '+(it.price-save.points)+' more',true);shake(el);return false}
    save.points-=it.price;save.boosts[it.key]=n+1;persist();refreshShop();toast(it.name+' bought! It will be used at the start of your next run');return true;
  }
  if(save.owned[id]){if(save.equip[it.cat]!==id){save.equip[it.cat]=id;persist();toast(it.name+' equipped')}refreshShop();return true}
  if(save.points<it.price){toast('Not enough points - need '+(it.price-save.points)+' more',true);shake(el);return false}
  save.points-=it.price;save.owned[id]=1;save.equip[it.cat]=id;persist();refreshShop();toast('Bought and equipped '+it.name+'!');return true;
}

function navMove(dir){
  var f=focusables(),a=document.activeElement,i=f.indexOf(a);
  if(i<0){(f[1]||f[0]).focus();return}
  var r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  f.forEach(function(el){if(el===a)return;var q=el.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,sc;
    if(dir==='r'){if(dx<=4||Math.abs(dy)>r.height*0.5)return;sc=dx}
    else if(dir==='l'){if(dx>=-4||Math.abs(dy)>r.height*0.5)return;sc=-dx}
    else if(dir==='d'){if(dy<=4)return;sc=dy+Math.abs(dx)*2}
    else{if(dy>=-4)return;sc=-dy+Math.abs(dx)*2}
    if(sc<bs){bs=sc;best=el}});
  if(!best){if(dir==='r'&&i<f.length-1)best=f[i+1];else if(dir==='l'&&i>0)best=f[i-1]}
  if(best){best.focus();if(best.scrollIntoView)best.scrollIntoView({block:'nearest'})}
}
function shopKey(e,k){
  if(k==='Escape'||k==='Esc'){e.preventDefault();closeShop();return}
  var dir={ArrowLeft:'l',Left:'l',ArrowRight:'r',Right:'r',ArrowUp:'u',Up:'u',ArrowDown:'d',Down:'d'}[k];
  if(dir){e.preventDefault();navMove(dir);return}
  if(k==='Enter'||k==='NumpadEnter'||k==='Space'||k===' '){e.preventDefault();if(e.repeat)return;var a=document.activeElement;
    if(focusables().indexOf(a)>=0)a.click();else navMove('d')}
}

function copyText(text,cb){
  function fallback(){var ok=false;try{var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');document.body.removeChild(ta)}catch(e){}cb&&cb(ok)}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){cb&&cb(true)},fallback);return}}catch(e){}
  fallback();
}
function openFbSharer(url,text){
  var u='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)+'&quote='+encodeURIComponent(text);
  copyText(text);  // Facebook may not pre-fill the text, so it is also on the clipboard to paste
  var w=window.open(u,'ninjaRunnerShare','width=626,height=600');
  if(w){try{w.opener=null}catch(e){}toast('Message copied too - paste it into your post if it is empty')}
  else toast('Pop-up blocked - message copied, paste it anywhere',true);
  return u;
}
function share(kind){
  var url=gameUrl(),text=shareText(kind);
  if(navigator.share){var d={title:'Ninja Runner',text:text};if(url)d.url=url;
    try{var pr=navigator.share(d);if(pr&&pr.catch)pr.catch(function(){});return 'native'}catch(e){}}
  if(url)return openFbSharer(url,text);
  copyLink(kind);  // file:// / no public link: copy the message (+ link if any) instead
  return 'copied';
}

    try{var pr=navigator.share(d);if(pr&&pr.catch)pr.catch(function(){});return 'native'}catch(e){}}
  if(url){var u=openFbSharer(url,text);copyText(text+' '+url);return u}
  copyLink('invite');return 'copied';
}
function copyLink(kind){
  var url=gameUrl(),t=shareText(kind==='invite'?'invite':'score'),text=url?t+' '+url:t;
  copyText(text,function(ok){toast(ok?(url?'Link copied - paste it into Facebook, Messenger or anywhere!':'Message copied. No public link yet - set GAME_URL once the game is online.'):'Could not copy on this device',!ok)});

  if(state==='shop'){shopKey(e,k);return}
  var ae=document.activeElement;
  if((k==='Space'||k===' '||k==='Enter'||k==='NumpadEnter')&&ae&&ae.tagName==='BUTTON'&&state!=='play')return; // let a focused button handle it
  if(k==='ArrowUp'||k==='Up'){e.preventDefault();if(!e.repeat)jump()}
  else if(k==='ArrowDown'||k==='Down'){e.preventDefault();keys.down=true;if(!e.repeat)slide()}
  else if(k==='ArrowRight'||k==='Right'){if(state==='play'){e.preventDefault();attack()}} // attack (needs an equipped weapon)
  else if(k==='Space'||k===' '||k==='Enter'||k==='NumpadEnter'){e.preventDefault();if(!e.repeat&&state!=='play')handleStartRestart()}
  else if((k==='Escape'||k==='Esc')&&state==='over'){e.preventDefault();goHome()}
  else if((k==='KeyS'||e.key==='s'||e.key==='S')&&!e.repeat&&(state==='start'||state==='over')){e.preventDefault();openShop(true)}
});
window.addEventListener('keyup',function(e){var k=e.code||e.key;if(k==='ArrowDown'||k==='Down')keys.down=false});
// Touch: swipe up = jump (swipe again mid-air = double jump), swipe down = slide. Tap only starts/restarts.
var ts=null,SWIPE=24;
function swipeCheck(tt){
  if(!ts||ts.acted)return;
  var dx=tt.clientX-ts.x,dy=tt.clientY-ts.y;
  if(Math.abs(dy)<SWIPE||Math.abs(dy)<Math.abs(dx))return;
  ts.acted=true;if(state!=='play')return;
  if(dy<0)jump();else slide();
}
cv.addEventListener('touchstart',function(e){e.preventDefault();var tt=e.changedTouches[0];ts={x:tt.clientX,y:tt.clientY,acted:false}},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();swipeCheck(e.changedTouches[0])},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();if(!ts)return;var tt=e.changedTouches[0];swipeCheck(tt);
  var moved=Math.abs(tt.clientX-ts.x)+Math.abs(tt.clientY-ts.y);
  if(!ts.acted&&moved<SWIPE&&state!=='play')handleStartRestart();
  ts=null},{passive:false});
cv.addEventListener('touchcancel',function(){ts=null});
cv.addEventListener('mousedown',function(){if(state!=='play')handleStartRestart()}); // desktop click: start/restart only
// attack button: taps on the button only (swipes on the game area still jump / slide)
atkBtn.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();attack()},{passive:false});
atkBtn.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation()},{passive:false});
atkBtn.addEventListener('mousedown',function(e){e.preventDefault();attack()});

resize();
reset();
syncUI();
AdService.showBanner();
requestAnimationFrame(loop);

// test hook
var hook={get state(){return state},get score(){return score()},jump:jump,slide:slide,showAd:showAd,watchReward:watchReward,ads:AdService,
  get view(){return {W:W,H:H,U:U,GROUND:GROUND,units:W/U,mobile:MOBILE}},get player(){return p},get obstacles(){return obs},get coins(){return coins},get dist(){return dist},get speed(){return speed},get stage(){return STAGES[stageIdx].name},
  get save(){return save},get run(){return run},get hs(){return hs},setKeyDown:function(v){keys.down=v},start:handleStartRestart,
  openShop:openShop,closeShop:closeShop,goHome:goHome,activate:activate,share:share,gameUrl:gameUrl,shareText:shareText,items:ITEMS,stages:STAGES,
  addPoints:function(n){save.points+=n;persist();if(state==='shop')refreshShop();syncUI()},die:function(){if(state==='play')die()},
  setStage:function(i){dist=i*STAGE_PTS*2+run.headDist*0;coinCount=0},
  attack:attack,get weapon(){return weapon()},weapons:WEAPONS,get shots(){return shots},get slash(){return slash},
  forceNext:function(ty){nextType=ty},forceAfter:function(ty){forceType=ty},
  warp:function(sc,spd){dist=sc*2;spawnGap=dist+4;obs.length=0;coins.length=0;if(spd)t=Math.max(0,(spd-BASE_SPEED)/0.12)},
  consts:{GRAV:GRAV,JUMP_V:JUMP_V,BOX3_H:BOX3_H,SHUR_EXTRA:SHUR_EXTRA,MIN_VIEW:MIN_VIEW,STACK3_PTS:STACK3_PTS,SHUR_PTS:SHUR_PTS}};
window.__ninjaRunner=hook;window.__stickRunner=hook;
})();
